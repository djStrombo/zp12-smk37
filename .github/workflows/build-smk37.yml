name: Build SMK-37 Firmware

on:
  push:
    branches: [ main, smk37 ]
  pull_request:
    branches: [ main, smk37 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl tar bzip2 xz-utils
          pip install pillow numpy

      - name: Download JieLi Toolchain
        run: |
          chmod +x tools/get_toolchain.sh
          tools/get_toolchain.sh "$HOME/.jieli"

      - name: Checkout JieLi AC79 SDK tools
        run: |
          git clone --depth 1 --filter=blob:none --sparse --branch AC79NN_SDK_V1.2.1_2023-12-13 https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git sdk
          git -C sdk sparse-checkout set cpu/wl82/tools

      - name: Build ZP-12 SMK-37 Package (.fwsc)
        run: |
          export JIELI_TOOLCHAIN="$HOME/.jieli/toolchain"
          python3 tools/build.py --board smk37 --sdk sdk/cpu/wl82/tools

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zp12-smk37-firmware
          path: |
            build/zp12-smk37*.fwsc
            build/zp12.bin
            build/loader/ota.bin
